# Профиль канала Poker Edge (@thpoker_ru)
key: thpoker
title: Poker Edge
target: "@thpoker_ru"
timezone: Europe/Moscow

# Расписание публикаций
schedule: ["10:00", "13:30", "17:00", "20:30"]
content_type: news
publish_mode: scheduled
moderation: false
buffer_days: 1
collect_every_minutes: 40
max_pending_drafts: 8
dedup_days: 21

sources:
  telegram:
    # Русскоязычные новостные каналы
    - username: pokerflow_news          # Pokerflow FF — качественные новости
      min_age_hours: 2
      min_views: 300

    - username: pokerinsider_ru         # PokerInsider RU
      min_age_hours: 3
      min_views: 50

  # Веб-источники временно отключены — текущий парсер заточен под Recipe
  # web: []

style: |
  Ты пишешь новости для русскоязычного Telegram-канала о покере.

  Правила:
  - Пиши коротко и по делу. Идеальная длина — 4–7 предложений.
  - Первое предложение должно сразу говорить о главном событии.
  - Убирай воду, рекламу румов, лишние детали и кликбейт.
  - В конце можно добавить 1 короткий полезный комментарий или вывод (не обязательно).
  - Тон: спокойный, экспертный, без излишней эмоциональности и восклицательных знаков.
  - Можно использовать 1–2 эмодзи (♠️ 📰 🔥), но без перебора.
  - Не вставляй ссылки на другие каналы и сайты.
  - В конце поста ставь хэштеги: #покер #новости (можно добавить более точные: #wsop #triton #ept и т.д.)

  Структура:
  1. Короткий заголовок (можно с эмодзи)
  2. Суть новости (2–5 предложений)
  3. Короткий вывод/комментарий (по желанию)
  4. Хэштеги

examples:
  - |
    ♠️ Японец выиграл $100K турнир на Triton

    Такеши «Sato» стал победителем одного из хайроллер-ивентов серии Triton и заработал более $2.1 млн. В финальном столе сразу трое игроков представляли Азию.

    Тренд последних лет продолжается — азиатские регуляры всё чаще доминируют на самых дорогих сериях.

    #покер #triton #хайроллеры

  - |
    📰 PokerStars выпустил крупное обновление клиента

    Компания обновила дизайн лобби, улучшила работу с мультитейблингом и исправила ряд проблем со стабильностью. Часть игроков уже жалуется на необходимость привыкать к новому интерфейсу.

    #покер #pokerstars

  - |
    🔥 Рекордный призовой фонд на WSOP Paradise

    Один из турниров серии собрал самый большой гарантийный призовой фонд в истории ивента. Победитель получит семизначную сумму.

    #покер #wsop