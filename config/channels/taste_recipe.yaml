# Профиль канала «Вкусные рецепты». Новый канал = новый такой файл с другим key.
key: taste_recipe
title: Вкусные рецепты
target: "@TasteRecipe"          # бот должен быть админом канала с правом публикации
# moderation_chat: 123456789    # по умолчанию — первый id из ADMIN_IDS
timezone: Europe/Moscow
schedule: ["09:00", "12:30", "16:00", "19:00", "21:30"]
# scheduled — одобренные посты сами уходят в «Отложенные» канала на ближайшие свободные слоты
#   (через аккаунт-читатель: он должен быть админом канала с правом публикации; лимит Telegram — 100 сообщений,
#    остаток ждёт в очереди и добавляется, когда место освободится — проверка при запуске и каждые 10 минут);
# bot — бот сам публикует из очереди в слоты расписания (программа должна работать постоянно)
publish_mode: scheduled
collect_every_minutes: 30
max_pending_drafts: 10
max_video_mb: 50

sources:
  # Проверено 18.11.2026 через t.me/s/: каналы активны, цифры примерные.
  # min_age_hours: пост берём через N часов после выхода, чтобы по просмотрам выбрать лучшие.
  # min_views: порог просмотров на момент сбора (с учётом выдержки).
  telegram:
    # --- публичные, в основном видео ---
    - username: receptOK            # Книга рецептов: ~545K подп., ~10K просм., видео
      min_age_hours: 6
      min_views: 5000
    - username: FastRecepts         # Быстрые рецепты: ~229K, ~4–5K просм., видео
      min_age_hours: 6
      min_views: 2000
    - username: kulinaria_receptii  # Кулинария Рецепты: ~237K, ~1.2K просм., видео
      min_age_hours: 6
      min_views: 800
    - username: vipichkadoma2025    # Выпечка дома: ~103K, ~650 просм., видео
      min_age_hours: 6
      min_views: 500
    - username: sam_sebesushist     # Сам себе сушист: ~22K, ~3–5K просм., видео; ниша суши/роллы
      min_age_hours: 6
      min_views: 2000
    # --- публичные, фото + видео ---
    - username: zakatochki          # Закатки и закуски: ~44K, ~1.5–2K просм.
      min_age_hours: 6
      min_views: 1000
    - username: salatiki_i          # Салатики, закаточки: ~29K, ~1K просм.
      min_age_hours: 6
      min_views: 700
    - username: best_retseptyy      # Рецептики на каждый день: ~36K, фото
      min_age_hours: 6
      min_views: 400
    - username: ppreceptiki         # ПП Рецепты | Здоровое питание: ~112K, ~400 просм.
      min_age_hours: 6
      min_views: 300
    - username: iamcook             # Аймкук — рецепты с фото и видео
      min_age_hours: 4
      min_views: 300
      initial_limit: 30
    - username: edimdomaru          # Едим Дома — рецепты с ингредиентами и шагами
      min_age_hours: 4
      min_views: 300
      initial_limit: 30

    # --- крупные приватные (по данным Telemetr). Нужна ссылка-приглашение t.me/+XXXX:
    #     найдите канал в поиске Telegram и скопируйте ссылку из описания или из «Поделиться».
    #     Аккаунт-читатель вступит сам при первом сборе.
    # - invite: https://t.me/+XXXX
    #   name: Кулинария | Вкусные Рецепты   # ~973K
    #   min_age_hours: 6
    #   min_views: 10000
    # - invite: https://t.me/+XXXX
    #   name: Простые Рецепты               # ~578K, ~21K просм.
    # - invite: https://t.me/+XXXX
    #   name: Мамины Рецепты                # ~661K
    # - invite: https://t.me/+XXXX
    #   name: Рецепты на каждый день        # ~448K
    # - invite: https://t.me/+XXXX
    #   name: Магия вкуса | рецепты         # ~356K
    # - invite: https://t.me/+XXXX
    #   name: ПП Рецепты | Быстро и Вкусно  # ~342K, ~11K просм.
    # - invite: https://t.me/+XXXX
    #   name: Еда без вреда | ПП рецепты    # ~336K, ~11K просм.

  web:
    # RSS-ленты (новые рецепты появляются автоматически)
    - rss: https://www.povarenok.ru/rss/recipes
      max_entries: 10
    - rss: https://povar.ru/rss
      max_entries: 10
    - rss: https://1000.menu/feed/news
      max_entries: 10
    - rss: https://www.say7.info/rss.xml
      max_entries: 10
    # Сайты без RSS: берём ссылки на рецепты со страницы каталога
    - pages: [https://www.gastronom.ru/recipe]
      link_pattern: '^https://www\.gastronom\.ru/recipe/\d+/[^/?#]+/?$'
      max_entries: 15
    - pages: [https://www.iamcook.ru/]
      link_pattern: '^https://www\.iamcook\.ru/showrecipe/\d+/?$'
      max_entries: 20
    - pages: [https://gotovim-doma.ru/]
      link_pattern: '^https://(?:www\.)?gotovim-doma\.ru/recipe/\d+-[^/?#]+/?$'
      max_entries: 15
    - pages: [https://eda.ru/recepty]
      link_pattern: 'eda\.ru/recepty/[a-z\-]+/[a-z0-9\-]+-\d+$'
      max_entries: 10
    - pages: [https://food.ru/recipes]
      link_pattern: 'food\.ru/recipes/\d+-'
      max_entries: 10
    - pages: [https://www.edimdoma.ru/retsepty]
      link_pattern: 'edimdoma\.ru/retsepty/\d+-'
      max_entries: 10

# Формат поста — «карточка рецепта» (собирается кодом из полей, которые заполняет модель):
#   <b>Название</b> 🍰
#   Интро: чем хорошо + призыв 👌🏻
#   ⏱ время · 🍽 порции · 👌 сложность
#   Ингредиенты: • …
#   [сворачиваемая цитата] Как готовить 👇 1. … 2. …
#   #рубрика
rubrics: [завтраки, супы, салаты, закуски, горячее, гарниры, выпечка, десерты, напитки, заготовки, пп]

style: |
  - title: название блюда без кавычек-ёлочек и эмодзи, 2–6 слов. Если у блюда «фирменное» название — оставь его в кавычках.
  - intro: 1–2 коротких предложения. Первое — главная выгода или особенность (за 10 минут, из 4 ингредиентов, без выпечки,
    диетическое, сочное, хрустящее…). Второе — короткий призыв: «Сохрани, ставь лайк и готовь с удовольствием!»
    или похожий по смыслу, меняй формулировки от поста к посту. В конце intro — 1 эмодзи.
  - Ингредиенты: «Название — количество», сокращения: ст. л., ч. л., г, мл, шт. Первая буква заглавная.
  - Шаги: коротко и по делу, глагол в начале («Смешайте», «Выпекайте 25 мин при 180 °C»).
  - Тон дружелюбный, без воды и канцелярита. Без ссылок.

examples:
  - |
    Диетическое пирожное "Картошка" за 10 минут с 4 ингредиентами. Сохрани, ставь лайк и готовь с удовольствием! 👌🏻

    Ингредиенты:
    - 4 хлебца
    - 1 банан
    - 2-3 ст. л. какао
    - Подсластитель по вкусу
    - Горький шоколад
